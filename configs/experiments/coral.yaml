experiment:
  name: acda3d_coral
  display_name: 3D-ACDA + CORAL
  method: coral
  source_domain: ADNI
  target_domain: OASIS
  folds: [0, 1, 2, 3, 4]
  seeds: [42]

paths:
  artifact_index: null
  artifact_root: null
  split_root: null
  atlas_metadata: null
  roi_masks: null
  output_root: null

model:
  config: configs/model/acda3d.yaml
  name: 3D-ACDA
  contextual_encoder: false
  num_classes: 3
  num_rois: 102

training:
  config: configs/training/default.yaml
  early_stopping: false
  resume: true

data_loader:
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  drop_last_train: true
  drop_last_eval: false

adaptation:
  name: coral
  feature: z
  weight: null
  active_during_warmup: false
  covariance:
    estimator: unbiased
    normalization: four_d_squared
    compute_dtype: float32

evaluation:
  source_validation: true
  target_monitoring: true
  target_monitoring_label: "MONITORING ONLY â€” NOT A TRAINING LOSS"
  export_checkpoints: [best_source_f1, last]

execution:
  overwrite: false
  continue_completed_folds: true
  fail_fast: false
  device: auto
