experiment:
  name: architectural_baselines
  display_name: Architectural Baselines
  method: baseline
  baseline_names:
    - aagn
    - faster_snn
  source_domain: ADNI
  target_domain: OASIS
  n_splits: 5
  folds: [0, 1, 2, 3, 4]
  seeds: [42]

paths:
  artifact_index: null
  artifact_root: null
  atlas_metadata: null
  roi_masks: null
  output_root: ../../runs

baseline_configs:
  aagn: ../baselines/aagn.yaml
  faster_snn: ../baselines/faster_snn.yaml

training:
  n_epochs: 25
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 2
  num_workers: 0
  use_amp: true
  grad_clip_norm: 1.0
  device: auto
  scheduler: cosine
  label_smoothing: 0.0
  seed: 42

training_policy:
  early_stopping: false
  checkpoint_metric: source_validation/macro_f1

evaluation:
  target_monitoring: true
  target_monitoring_label: "MONITORING ONLY — NOT A TRAINING LOSS"
  export_checkpoints:
    - best_source_f1
    - last

execution:
  sequential: true
  overwrite: false
  continue_completed_folds: true
  fail_fast: false
