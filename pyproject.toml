[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-acda"
version = "0.1.0"
description = "Anatomically interpretable domain adaptation for 3D MRI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Repository" }
authors = [
  { name = "3D-ACDA contributors" }
]
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "torch",
  "nibabel",
  "matplotlib",
  "scikit-learn",
  "scipy",
]

[project.optional-dependencies]
full = [
  "SimpleITK",
  "monai",
]
dev = [
  "pytest",
  "ruff",
  "statsmodels",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "notebooks/archive",
  "*.ipynb",
  "atlas_utils.py",
  "build_precomputed_artifacts.py",
  "concept_targets.py",
  "dataset_contract.py",
  "helpers.py",
  "jacobian_utils.py",
  "losses.py",
  "model.py",
  "preprocessing.py",
  "trainer.py",
  "wire_and_train.py",
  "wire_and_train_precomputed.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = ["--basetemp=artifacts/pytest-tmp-phase13"]
