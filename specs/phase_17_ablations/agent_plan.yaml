phase: 17
slug: ablations
status: completed_phase17_closed
artifact_store: both
execution_mode: interactive
strict_tdd: true
protected_boundaries:
  - no_real_adni_oasis_training
  - no_publication_results
  - no_concept_interventions
  - no_roi_deletion_or_sufficiency
  - no_causal_explanation_analysis
  - no_external_baselines
  - no_manuscript_rewrite
  - no_phase_18
  - no_target_diagnosis_labels_in_adaptation
  - source_validation_macro_f1_only_checkpoint_selection
  - fixed_epochs_only
  - target_monitoring_only

ownership_rule: "Exactly one agent owns each action; active actions have non-overlapping file ownership."

# Runtime subagent names may be substituted by the orchestrator when the named
# external agent profile is unavailable; scientific ownership remains authoritative.
actions:
  - id: phase16-closure-and-ablation-audit
    agent: opencode
    depends_on: []
    owns:
      - AGENTS.md
      - specs/phase_17_ablations/decisions.md
      - specs/phase_17_ablations/ablation_inventory.yaml
    responsibility: >-
      Record Phase 16 closure and approval, validation evidence, preserved
      incident/lifecycle gates, and exhaustive historical ablation inventory.

  - id: canonical-ablation-extraction
    agent: claude-code
    depends_on: [phase16-closure-and-ablation-audit]
    owns:
      - specs/phase_17_ablations/notebook_extraction.md
      - specs/phase_17_ablations/requirements.md
      - specs/phase_17_ablations/design.md
      - specs/phase_17_ablations/tasks.md
      - specs/phase_17_ablations/acceptance.md
      - specs/phase_17_ablations/equivalence_map.md
      - specs/phase_17_ablations/output_schema.md
    responsibility: >-
      Extract canonical definitions, exact interventions, warm/full objectives,
      equivalences, blockers, and executable SDD contracts.

  - id: independent-specification-review
    agent: kimi
    depends_on: [canonical-ablation-extraction]
    owns:
      - specs/phase_17_ablations/spec_review.md
    responsibility: >-
      Independently reject invented or obsolete variants and verify fairness,
      architecture boundaries, target-label isolation, and ownership.

  - id: implement-ablation-registry-and-resolver
    agent: codex
    depends_on: [independent-specification-review]
    owns:
      - src/pada3dacb/ablations/__init__.py
      - src/pada3dacb/ablations/schemas.py
      - src/pada3dacb/ablations/registry.py
      - src/pada3dacb/ablations/resolver.py
      - src/pada3dacb/ablations/outputs.py
      - tests/phase_17/test_registry_resolver.py
    responsibility: >-
      Implement validated registry schemas, blocked/runnable dispositions,
      explicit aliases, equivalence references, and configuration resolution.

  - id: implement-loss-component-ablations
    agent: codex
    depends_on: [implement-ablation-registry-and-resolver]
    owns:
      - src/pada3dacb/adaptation/prototype_pseudo.py
      - src/pada3dacb/training/uda_trainer.py
      - tests/phase_17/test_composition_diagnostics.py
    responsibility: >-
      Add only approved compositional loss interventions and raw/weighted/active
      diagnostics while reusing the canonical trainer.

  - id: implement-architectural-ablations
    agent: codex
    depends_on: [implement-ablation-registry-and-resolver]
    owns:
      - src/pada3dacb/models/ablations/
      - tests/phase_17/test_architecture_ablation.py
    responsibility: >-
      Implement only independently approved canonical architectural ablations;
      otherwise mark NOT_APPLICABLE and create no model file.

  - id: independent-mathematical-verification
    agent: gemini-cli
    depends_on: [implement-loss-component-ablations, implement-architectural-ablations]
    owns:
      - tests/phase_17/test_mathematical_reference.py
      - tests/phase_17/test_target_firewall.py
    responsibility: >-
      Verify objective equations, disabled components, gradients, equivalence,
      architecture parity, and target-label isolation.

  - id: experiment-cli-integration
    agent: opencode
    depends_on: [independent-mathematical-verification]
    owns:
      - src/pada3dacb/experiments/ablations.py
      - scripts/run_ablations.py
      - configs/experiments/ablations.yaml
      - configs/ablations/
      - src/pada3dacb/experiments/run_manifest.py
      - src/pada3dacb/experiments/fold_summary.py
      - src/pada3dacb/experiments/prediction_export.py
    responsibility: >-
      Implement dry-run/validate-only orchestration, hashes, directories,
      equivalence references, and preservation of existing method CLIs.

  - id: complete-integration-and-regression-tests
    agent: codex
    depends_on: [experiment-cli-integration]
    owns:
      - tests/phase_17/test_synthetic_lifecycle.py
      - tests/phase_17/test_protected_methods_regression.py
      - tests/phase_17/test_cli_regression.py
    responsibility: >-
      Test approved/blocked candidates, both directions, folds, lifecycle,
      resume, target firewall, prior methods, and Phase 15/16 boundaries.

  - id: documentation
    agent: claude-code
    depends_on: [complete-integration-and-regression-tests]
    owns:
      - docs/ABLATION_EXPERIMENTS.md
      - docs/PHASE17_REPORT.md
      - docs/IMPLEMENTATION_AUDIT.md
    responsibility: >-
      Document provenance, scientific questions, equivalences, blockers,
      synthetic-only evidence, and absence of performance claims.

  - id: final-audit
    agent: kimi
    depends_on: [documentation]
    owns:
      - specs/phase_17_ablations/final_audit.md
    responsibility: >-
      Audit traceability, single-component fairness, target firewall, previous
      phase regressions, native lifecycle status, and Phase 18 absence.

  - id: final-validation
    agent: opencode
    depends_on: [final-audit]
    owns: []
    responsibility: >-
      Execute complete validation and synthetic lifecycle evidence, save final
      Engram summary, and stop before Phase 18.

validation:
  install: python -m pip install -e .
  import_check: python -c "import pada3dacb; print(pada3dacb.__version__)"
  tests: python -m pytest -q
  lint: python -m ruff check .
  diff_check: git diff --check
  full_suite_clean_basetemp_note: >-
    The repository pyproject config uses a shared historical basetemp. When
    stale Windows temporary state affects a run, validation must record the
    explicit clean --basetemp override and its exact result rather than hide it.
  final_validation_evidence: >-
    Direct evidence: `python -m pytest -q` exited 0 with 1178 passed, 7 warnings,
    and 1012.14s (0:16:52); the focused Phase 17 recheck passed 119 tests with
    0 warnings. Final independent review PASS was returned by fallback
    `gentle-ai-verify` because requested `kimi` was unavailable.

final_independent_review:
  result: PASS
  reviewer: gentle-ai-verify
  requested_reviewer: kimi
  fallback_reason: requested reviewer unavailable
  validation_evidence:
    full_suite: "python -m pytest -q; exit 0; 1178 passed, 7 warnings, 1012.14s (0:16:52)"
    focused_phase_17: "python -m pytest -q -p no:cacheprovider tests/phase_17 --basetemp=artifacts/pytest-tmp-phase17-full-recheck; 119 passed, 0 warnings"
    lifecycle_and_regressions: "60 synthetic CLI plans; approved validate-only; blocked no_domain_adaptation/no_ctx_encoder/invalid rejection exit 2; complete lifecycle 1 passed; target firewall 5 passed; prior-method/Phase15/Phase16 subset 66 passed; registry/CLI subset 43 passed"
  next_action: Stop and await explicit human approval; do not start Phase 18 or authorize real execution.
