method_contract:
  production_method: PADA-3DACB
  architecture:
    retained:
      - Encoder3D
      - ROITokenizer
      - token normalization
      - token MLP and dropout
      - AttentionAggregator
      - ClassificationHead
      - ConceptBottleneck
    forbidden_or_removed:
      - ContextualROIEncoder
      - ctx_enc
      - Transformer-based ROI contextual mixing
      - Full/Lite runtime switch
      - identity patching of a Full model
  labels:
    order: [CN, MCI, AD]
    indices: {CN: 0, MCI: 1, AD: 2}
  target_label_contract:
    target_adaptation_batch_keys: [x, subject_id, subject_hash, cohort]
    target_label_fields_forbidden:
      - y
      - label
      - label_name
      - true_label
      - c_target
      - g_bar
      - diagnosis
      - stored_diagnostic_probabilities
      - concept_targets
      - jacobian_targets
      - other_supervision_fields
      - other_artifact_fields
    target_diagnosis_labels_in_adaptation: forbidden
    target_evaluation_labels: "Monitoring only; not a training loss"
    target_adaptation_and_evaluation_disjoint: true
    concept_targets_and_jacobian_targets: "Immutable precomputed source artifacts; no regeneration in the ablation runner"

objective_contract:
  source: "training_original.ipynb cell 8, lines 526-625; primary values cell 14, lines 504-524"
  primary_coefficients:
    lambda_z: 1.0
    lambda_c: 1.0
    lambda_cons: 0.1
    lambda_cbm: 0.5
    lambda_anat: 0.2
    lambda_proto: 1.0
    lambda_pl: 0.1
    tau_p: 0.95
    proto_margin: 1.0
    lambda_sep: 0.1
    label_smoothing: 0.1
    warm_lambda_z: 0.1
    warm_lambda_c: 1.0
    warm_lambda_cbm: 1.0
    warm_lambda_anat: 1.0
    warm_lambda_cons: 0.0
  warm:
    equation: "warm_lambda_z*lambda_z*L_cls_z + warm_lambda_c*lambda_c*L_cls_c + warm_lambda_cbm*lambda_cbm*L_concept + warm_lambda_anat*lambda_anat*L_anat + warm_lambda_cons*lambda_cons*L_cons"
    prototype_term: absent_and_logged_as_zero
    pseudo_label_term: absent_and_logged_as_zero
  full:
    equation: "lambda_z*L_cls_z + lambda_c*L_cls_c + lambda_cons*L_cons + lambda_cbm*L_concept + lambda_anat*L_anat + lambda_proto*L_proto + lambda_pl*L_pl"
    prototype_probability_source: concept_head_target_logits
    pseudo_label_probability_source: concept_head_target_logits
  unresolved_configuration:
    name: lambda_proto_0.2
    source: "cell 18, lines 61-86: build_ablation_loss default; cell 8, lines 463-488: class default"
    classification: unsupported
    repository_primary_value: 1.0
    manuscript_or_later_helper_value: 0.2
    blocker: "D-14-001 remains unresolved; do not choose a publication-facing value in this inventory."

checkpoint_output_policy:
