ownership_validation:
  checked_key: owned_paths
  command: >-
    python -c "import collections,yaml; p='specs/phase_15_predictive_evaluation/agent_plan.yaml'; d=yaml.safe_load(open(p,encoding='utf-8')); a=d['actions']; pairs=[(x['id'],q) for x in a for q in x['owned_paths']]; c=collections.Counter(q for _,q in pairs); dup=sorted(q for q,n in c.items() if n>1); print(f'actions={len(a)} paths={len(pairs)} duplicates={len(dup)}'); print('duplicate_paths='+repr(dup)); assert len(a)==14 and len(pairs)==60 and not dup"
  expected_output:
    - actions=14 paths=60 duplicates=0
    - duplicate_paths=[]
  action_count: 14
  path_count: 60
  duplicate_count: 0
  duplicate_owned_paths: []
  static_duplicate_review: pass
  status: passed-at-WU-R22-after-failed-WU-R17
