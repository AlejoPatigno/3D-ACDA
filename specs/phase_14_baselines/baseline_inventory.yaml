inspection_depth: reconciled_authoritative_baseline_inventory
verified_directly_against_notebook: true
graphify_graph_present: true
production_code_created: false
authoritative_for_implementation_gate: true
classification_schema:
  allowed_values:
    - active_executed
    - active_not_executed
    - obsolete
    - helper_only
    - proposed_model_copy
    - posthoc_analysis_only
  unresolved_policy: "Use unresolved with reason only when notebook evidence is insufficient; unresolved items are blocked from migration."
first_slice_gate:
  approved_baselines: [AAGN, FasterSNN]
  blocked_without_later_approval:
    - CNN_design_for_AD
    - DenseNet-CNN
    - ViT
    - LongFormer
    - Joint-Transformer
    - DA-ViT
    - BiFPN3DViT
  do_not_migrate:
    - AlzheimerSupervisedMRIModel
    - obsolete definitions
    - helper-only symbols except when needed by approved baselines
    - posthoc notebook reporting

notebook_cells:
  - cell_index: 7
    cell_type: code
    role: proposed_model_copy_source
    notes:
      - Contains AlzheimerSupervisedMRIModel, a copied/subclassed supervised wrapper around AlzheimerDomainAdaptationModel.
      - This symbol is not part of the final baseline factory or baseline CV workflow and is blocked from migration.
  - cell_index: 17
    cell_type: code
    line_count: 1797
    role: baseline_training_suite
    notes:
      - Contains baseline configs, model definitions, classification-only loss/trainer, dataset helpers, CV orchestration, external-cohort evaluation, and result summarization.
      - Contains two generations of some symbols; later definitions in the same cell supersede earlier Python names when executed top-to-bottom.
  - cell_index: 18
    cell_type: code
    line_count: 63
    role: example_usage
    notes:
      - Kaggle/path-specific example invocation.
      - The notebook example uses cohort="target"; Phase 14 production first slice explicitly rejects target-cohort training and uses source_train/source_validation plus target_evaluation monitoring only.
      - Uses baseline_names example with AAGN and FasterSNN active and other baselines commented.

