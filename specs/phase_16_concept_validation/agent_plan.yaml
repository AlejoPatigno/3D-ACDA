  - id: documentation
    agent: claude-code
    depends_on: [complete-integration-and-regression-tests]
    responsibility: Run and record required focused and full validation first; then document safe evaluator use, actual Phase 16 evidence, exact outputs/provenance, scientific limitations, and implementation scope before final audit.
    owned_paths:
      - docs/CONCEPT_EVALUATION.md
      - docs/PHASE16_REPORT.md
      - docs/IMPLEMENTATION_AUDIT.md

  - id: final-audit
    agent: kimi
    depends_on: [documentation]
    responsibility: Independently audit scientific validity, ROI and concept provenance, target-label firewall, previous-phase regressions, and absence of Phase 17 work.
    owned_paths:
      - specs/phase_16_concept_validation/final_audit.md

  - id: final-validation
    agent: opencode
    depends_on: [final-audit]
    responsibility: Rerun and attest editable install, import, full pytest, Ruff, diff check, and complete synthetic Phase 16 runtime-harness evidence to Engram and the user-facing result without editing repository documentation or evidence files.
    owned_paths: []

  - id: maintain-openspec-mirrors-and-agent-plan
    agent: opencode
    depends_on: []
    responsibility: Maintain only the OpenSpec proposal, capability specification, design, task mirror, and repository agent plan; validate ownership without changing scientific or implementation artifacts.
    owned_paths:
      - openspec/changes/phase-16-concept-validation/proposal.md
