version: 2
change: phase-16-concept-validation
artifact_language: English
execution: serial
conceptual_owner_fallback:
  requested: claude-code
  runtime: package-sdd-tasks
  applies_to_planning_only: true
review_workload:
  estimated_remediation_authored_changed_lines: 2000-4000
  budget_risk: High
  chained_prs_recommended: true
  delivery_strategy: blocked-no-pr-native-receipt-1793
  chain_strategy: pending
  decision_needed_before_apply: false
  decision_scope: local-serial-synthetic-only-no-delivery
  decision_satisfied_by: [spec-approved, synthetic-implementation, synthetic-verification, native-receipt-1793-delivery-block]
  later_slices_require_own_measurement: true
  implementation_slice_target_changed_lines: "<=400"
  hard_pre_slice_measurement_gate: true
  size_exception_authorized: false
synthetic_apply_gate:
  requires_only: [spec-approved, current-slice-pre-measurement-within-budget, strict-red-evidence-before-production]
  measurement: additions-plus-deletions
  split_again_if_forecast_or_actual_exceeds_400: true
  reserve_must_not_be_consumed_silently: true
  next_slice:
    id: WU-01
    task: T-16-01
    exact_paths: [specs/phase_16_concept_validation/requirements.md, specs/phase_16_concept_validation/design.md, specs/phase_16_concept_validation/tasks.md, specs/phase_16_concept_validation/acceptance.md, specs/phase_16_concept_validation/metric_protocol.md, specs/phase_16_concept_validation/output_schema.md, specs/phase_16_concept_validation/agent_plan.yaml, specs/phase_16_concept_validation/decisions.md, specs/phase_16_concept_validation/manuscript_extraction.md]
    forecast_range: 80-160
    hard_forecast_ceiling: 400
planning_artifact_delivery:
  exceeds_400_changed_lines: true
  blocked_by: native-receipt-1793
  selected_pr_boundary: null
  size_exception_authorized: false
  downstream_delivery_decision_required: boundary-or-compression
  blocks_synthetic_apply: false
  note: Existing planning artifacts do not fit a single 400-line PR; their separate future delivery decision is downstream and is not an apply prerequisite.
chain_delivery:
  strategy: pending
  planning_only: true
  no_pr_while_blocked: true
  tracker_or_child_branches_created: false
  commits_created: false
  prs_created: false
  blocked_by: native-receipt-1793
administrative_blockers:
  - id: native-receipt-1793
    blocks: [tracker-branch, child-branches, planning-artifact-delivery, archive, commit, push, pr, release, publication]
    does_not_block: [planning-correction, synthetic-implementation, synthetic-verification]
scientific_gates:
  real_evaluation_only_blockers:
    - export-authorization
    - concept-normalizer-resolution
    - atlas-hash-resolution
  real_evaluation_requires:
    - complete-authorized-immutable-exports
    - concept-normalizer-resolution
    - atlas-hash-resolution
    - hash-bound-independent-statistical-protocol-approval
scope:
  prohibited_ownership:
    - src/pada3dacb/training/**
    - src/pada3dacb/models/**
    - src/pada3dacb/losses/**
    - src/pada3dacb/adaptation/**
    - src/pada3dacb/data/**
    - configs/experiments/**
    - artifacts/runs/**
    - specs/phase_17/**
  amendment_rule: A later independently reviewed defect must amend this plan before any prohibited or currently unowned path is edited.
actions:
  - id: phase15-closure-and-concept-audit
    agent: opencode
    depends_on: []
    responsibility: Close T-15-16 and T-15-17; reconcile Phase 15 status; correct AAGN naming; record native receipt #1793; inventory concept outputs, artifacts and checkpoints; confirm no Phase 16 implementation existed before authorization.
    owned_paths:
      - AGENTS.md
      - specs/phase_16_concept_validation/decisions.md

  - id: concept-contract-extraction
    agent: claude-code
    depends_on: [phase15-closure-and-concept-audit]
    responsibility: Extract exact concept/anatomy/head semantics from notebooks and manuscript; extract CFS/ACS/PCS/QIS when supported; specify aggregation and metrics; document unresolved definitions.
    owned_paths:
      - specs/phase_16_concept_validation/manuscript_extraction.md
      - specs/phase_16_concept_validation/requirements.md
      - specs/phase_16_concept_validation/design.md
      - specs/phase_16_concept_validation/tasks.md
      - specs/phase_16_concept_validation/acceptance.md
      - specs/phase_16_concept_validation/metric_protocol.md
      - specs/phase_16_concept_validation/output_schema.md

  - id: independent-scientific-review
    agent: kimi
    depends_on: [concept-contract-extraction]
    responsibility: Reject invented score definitions; verify target-label isolation; verify subject-level aggregation; verify no causal overclaiming; approve or block implementation.
    owned_paths:
      - specs/phase_16_concept_validation/spec_review.md

  - id: implement-concept-discovery-and-inference
    agent: codex
    depends_on: [independent-scientific-review]
    responsibility: Implement read-only artifact/checkpoint discovery; implement evaluation dataset; implement no-grad subject inference; validate K, ROI order and hashes.
    owned_paths:
      - src/pada3dacb/evaluation/concepts/__init__.py
      - src/pada3dacb/evaluation/concepts/schemas.py
      - src/pada3dacb/evaluation/concepts/dataset.py
