ownership_validation:
  checked_key: owned_paths
  command: >
    python -c "import collections,yaml; p='specs/phase_16_concept_validation/agent_plan.yaml'; d=yaml.safe_load(open(p,encoding='utf-8')); a=d['actions']; pairs=[(x['id'],q) for x in a for q in x['owned_paths']]; c=collections.Counter(q for _,q in pairs); dup=sorted(q for q,n in c.items() if n>1); print(f'actions={len(a)} paths={len(pairs)} duplicates={len(dup)}'); print('duplicate_paths='+repr(dup)); assert not dup"
  expected_output:
    - "duplicate_paths=[]"
  action_count: 13
  path_count: 0
  duplicate_count: 0
  duplicate_owned_paths: []
  static_duplicate_review: pass
  status: pending