    agent: gemini-cli
    depends_on: [implement-statistics-figures-tables]
    responsibility: Verify metric equations; verify constant-ROI behavior; verify aggregation; verify bootstrap unit; verify method pairing; verify no target adaptation or gradients.
    owned_paths:
      - tests/test_concept_metrics_reference.py
      - tests/test_concept_statistics_reference.py
      - tests/test_concept_statistics_edge_cases.py

  - id: report-cli-integration
    agent: opencode
    depends_on: [independent-mathematical-verification]
    responsibility: Implement CLI; implement real gate; implement dry-run and validate-only; implement manifests, output directories and reuse.
    owned_paths:
