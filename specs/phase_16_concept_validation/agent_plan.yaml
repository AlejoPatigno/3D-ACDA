      - tests/test_concept_class_profiles.py

  - id: implement-statistics-figures-tables
    agent: codex
    depends_on: [implement-agreement-stability-profiles]
    responsibility: Reuse subject bootstrap; implement paired method comparisons; implement Holm correction; generate complete non-cherry-picked tables and figures.
    owned_paths:
