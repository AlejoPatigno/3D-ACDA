  - no_mmd_non_equivalence_to_source_only
  - read_report_alias_resolution_without_path_or_id_mutation
  - canonical_configuration_hash_coverage
  - checkpoint_and_resume_coverage
  - fixed_epochs_and_source_validation_macro_f1_selection
  - subject_level_aggregation

