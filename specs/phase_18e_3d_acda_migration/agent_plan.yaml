    prerequisites: [explicit_user_phase_c_reporting_only_authorization, frozen_source_commit_or_tag_and_notebook_boundary_verified, live_notebook_training_import_reachability_check, exclusive_non_interference_proof]
    evidence_artifact: phase_c_reporting_only_start_boundary_record
