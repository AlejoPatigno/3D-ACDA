model_contract:
  task_classifier_logits: "(B,2) raw logits"
  target_ids: [0, 1]
  loss: "PyTorch-style CrossEntropyLoss; not BCEWithLogitsLoss, sigmoid, or one-logit BCE"
  concept_outputs: [B, K]
  cdan_dimension: "runtime z_dim * n_classes; (128,2) = 256; distinct configuration required"
  cdan_gradient_to_z_and_p_required: true
  prototype_pseudo_ids: [0, 1]
  prototype_absent_class_cases_required: [0, 1]
  empty_accepted_pseudo_set_loss: zero
  coral_mmd: unchanged
